<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Docker CI/CD Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 60px 20px;
        }
        .card {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px #00000015;
        }
        h1 { color: #2563eb; }
        .version { font-size: 24px; font-weight: bold; }
        .status { color: #15803d; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Jenkins Docker CI/CD Lab</h1>
        <h2>Demo Web Application</h2>
        <p class="version">Version: __APP_VERSION__</p>
        <p class="status">Status: Running</p>
        <p>Automated deployment and rollback practice.</p>
    </div>
</body>
</html>
